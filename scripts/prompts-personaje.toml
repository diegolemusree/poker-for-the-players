# Prompts para scripts/generar-personaje.py (siguen docs/ESPEC-PERSONAJES.md)
#
# Nunca se genera desde cero: cada cuadro es una lista de cambios, y cada cambio es UNA llamada que edita
# la base aprobada del personaje (arte/personajes/<id>/<id>-<ángulo>-espera.png). De cada llamada solo se
# toma su zona:
#   cara    la caja "face" de client/stage/personajes.json
#   brazos  de la barbilla a un poco abajo de la cintura ("waist" de personajes.json)
# El prompt de un cambio es [edicion] con {cambio} (su texto) y {se_queda} (el de su zona). Lo que va
# entre llaves sale de la ficha del personaje, scripts/fichas/<id>.toml: {parpadeo}, {mira_cartas},
# {sonrisa}, {manos}, {fichas}, {fondo}, {rasgos} y {opacas}.
#
# Puedes cambiar cualquier texto entre las comillas triples ("""). Los textos van en inglés porque el
# modelo los sigue mejor. Después de editar, prueba sin gastar con:
#   .venv-rembg/bin/python scripts/generar-personaje.py generar <personaje> --pose frente-<cuadro> --simular

[config]
modelo = "gemini-nano-banana-2.1"   # ver precios en ai.google.dev/gemini-api/docs/pricing
image_size = "1K"                   # las bases miden 1024 px de ancho: 1K regresa el mismo tamaño

[edicion]
texto = """
Edit the attached image. Change only one thing: {cambio}. Everything else stays exactly identical, \
pixel for pixel: {se_queda}, the line work, the colors, the framing, the size, the position and the \
flat {fondo} background.{opacas} Do not add text, letters, numbers or logos anywhere. Do not move, \
resize or redraw anything else.
"""
# se agrega después de "background." solo si la ficha tiene partes opacas
opacas = " These parts are solid and opaque, and the background never shows through them: {lista}."

[zonas.cara]
se_queda = "the rest of the face and the expression, the head{rasgos}, the body, the pose, the hands, the cards, the chair"

[zonas.brazos]
se_queda = "the face and the expression, the head{rasgos}, the legs, the chair"

# Una frase por revisión que falló, para el reintento (se agrega al final del prompt).
[correcciones]
alineacion = "Keep the character in exactly the same position, size and framing as in the attached image."
costura = "Keep the colors and lines around the change exactly the same as in the attached image."
sin_cambio = "Make sure the change is clearly visible."
de_mas = "Change only what is described; the rest of the face stays exactly as it is."
fondo = "Do not use the background color or anything close to it on the character, and keep the background flat."
texto = "Do not draw any text, letters, numbers or symbols."
caja = "Keep everything inside the same outline as in the attached image."
sin_imagen = "Return the edited image."

# ---------- cuadros ----------

[[cuadros.parpadeo]]
zona = "cara"
texto = "{parpadeo}"

[[cuadros.espia]]
zona = "cara"
texto = "{mira_cartas}"

[[cuadros.apuesta]]
zona = "brazos"
texto = """
the arms, hands and cards: the character holds the two face-down cards in one hand in front of the \
chest and, with the other hand, reaches forward at chest height, palm up, holding a small stack of \
{fichas}. The hands keep their design ({manos}) and the card backs stay navy blue with a white border
"""

[[cuadros.retirarse]]
zona = "brazos"
texto = """
the arms, hands and cards: with both hands at chest height, the character lazily tosses the two \
face-down cards forward with a flick of the fingers, hands open. The hands keep their design ({manos}) \
and the card backs stay navy blue with a white border
"""

# gana son dos cambios, cada uno en su llamada y sobre la base: primero los brazos, luego la cara
[[cuadros.gana]]
zona = "brazos"
texto = """
the arms, hands and cards: the character holds the two cards against the chest with one hand and \
raises a small stack of {fichas} at chest height with the other, as if pulling the pot toward \
themselves. The hands keep their design ({manos}) and the card backs stay navy blue with a white border
"""

[[cuadros.gana]]
zona = "cara"
texto = "{sonrisa}"

# ---------- cartas: el reverso de la baraja en las cartas de la mano (comando cartas) ----------
# UNA llamada edita la espera aprobada con dos imágenes: la base y el reverso aprobado (arte/baraja/reverso-carta.png,
# el marco sin la etiqueta). Las cartas toman ese reverso y, si hace falta, cambian de tamaño para que en la mesa todos
# tengan cartas del mismo ancho (CARTA_MESA en generar-personaje.py). Solo se toma la zona de las cartas; si el
# tamaño cambia mucho, también la de las manos y los antebrazos. {tamano} es una de igual, mas_grandes o mas_chicas.
[cartas]
texto = """
Edit the first attached image. Change only one thing: the two face-down playing cards held in the hands. Their \
backs now look like the card back in the second attached image: white, with an ornate brick-red scroll frame along \
the edges and a plain white center, with no text, letters or logo. {tamano}{manos_frase} {agarre} Everything \
else stays exactly identical, pixel for pixel: {se_queda}, the line work, the colors, the framing, the size, the position \
and the flat {fondo} background.{opacas} Do not add text, letters, numbers or logos anywhere. Do not move, resize \
or redraw anything else.
"""
igual = "The cards keep their size, position and angle."
mas_grandes = "The cards become about {pct}% larger than now (each card about {px} pixels wide, including its dark outline, in this {lado}-pixel-wide image), in the same position and angle."
mas_chicas = "The cards become about {pct}% smaller than now (each card about {px} pixels wide, including its dark outline, in this {lado}-pixel-wide image), in the same position and angle."
# cómo sostienen las cartas, para los seis: por abajo y los lados, para que se vea casi todo el reverso
agarre = "The hands hold the cards only by their bottom edge and sides, with the fingers covering as little of the card backs as possible, so most of each card back stays visible."
# solo si el tamaño cambia mucho (la zona incluye las manos y los antebrazos)
manos_frase = " The hands and forearms adjust so they hold the resized cards naturally; the hands keep their design ({manos}) and their size."
se_queda = "the face and the expression, the head{rasgos}, the body, the arms, the hands, the legs, the chair"
se_queda_manos = "the face and the expression, the head{rasgos}, the body, the upper arms, the legs, the chair"

# las frases de las revisiones propias de este comando, para el reintento ({sentido} es "too big" o "too small")
[cartas.correcciones]
tamano = "The cards came out {sentido}: each card must be about {px} pixels wide, including its dark outline, in this {lado}-pixel-wide image."
sin_cartas = "The card backs must clearly be white with the brick-red ornate frame of the second image."
azul = "No part of the old navy blue card backs remains."
rojo = "Keep the red of the card frames a pure brick red, never pink or purple."
