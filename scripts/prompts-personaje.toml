# Prompts para scripts/generar-personaje.py (siguen docs/ESPEC-PERSONAJES.md)
#
# Nunca se genera desde cero: cada cuadro es una lista de cambios, y cada cambio es UNA llamada que edita
# la base aprobada del personaje (arte/personajes/<id>/<id>-<ángulo>-espera.png). De cada llamada solo se
# toma su zona:
#   cara    la caja "face" de client/stage/personajes.json
#   brazos  de la barbilla a un poco abajo de la cintura ("waist" de personajes.json)
# El prompt de un cambio es [edicion] con {cambio} (su texto) y {se_queda} (el de su zona). Lo que va
# entre llaves sale de la ficha del personaje, scripts/fichas/<id>.toml: {parpadeo}, {mira_cartas},
# {sonrisa}, {manos}, {fichas}, {fondo}, {rasgos} y {opacas}.
#
# Puedes cambiar cualquier texto entre las comillas triples ("""). Los textos van en inglés porque el
# modelo los sigue mejor. Después de editar, prueba sin gastar con:
#   .venv-rembg/bin/python scripts/generar-personaje.py generar <personaje> --pose frente-<cuadro> --simular

[config]
modelo = "gemini-nano-banana-2.1"   # ver precios en ai.google.dev/gemini-api/docs/pricing
image_size = "1K"                   # las bases miden 1024 px de ancho: 1K regresa el mismo tamaño

[edicion]
texto = """
Edit the attached image. Change only one thing: {cambio}. Everything else stays exactly identical, \
pixel for pixel: {se_queda}, the line work, the colors, the framing, the size, the position and the \
flat {fondo} background.{opacas} Do not add text, letters, numbers or logos anywhere. Do not move, \
resize or redraw anything else.
"""
# se agrega después de "background." solo si la ficha tiene partes opacas
opacas = " These parts are solid and opaque, and the background never shows through them: {lista}."

[zonas.cara]
se_queda = "the rest of the face and the expression, the head{rasgos}, the body, the pose, the hands, the cards, the chair"

[zonas.brazos]
se_queda = "the face and the expression, the head{rasgos}, the legs, the chair"

# Una frase por revisión que falló, para el reintento (se agrega al final del prompt).
[correcciones]
alineacion = "Keep the character in exactly the same position, size and framing as in the attached image."
costura = "Keep the colors and lines around the change exactly the same as in the attached image."
sin_cambio = "Make sure the change is clearly visible."
de_mas = "Change only what is described; the rest of the face stays exactly as it is."
fondo = "Do not use the background color or anything close to it on the character, and keep the background flat."
texto = "Do not draw any text, letters, numbers or symbols."
caja = "Keep everything inside the same outline as in the attached image."
sin_imagen = "Return the edited image."

# ---------- cuadros ----------

[[cuadros.parpadeo]]
zona = "cara"
texto = "{parpadeo}"

[[cuadros.espia]]
zona = "cara"
texto = "{mira_cartas}"

[[cuadros.apuesta]]
zona = "brazos"
texto = """
the arms, hands and cards: the character holds the two face-down cards in one hand in front of the \
chest and, with the other hand, reaches forward at chest height, palm up, holding a small stack of \
{fichas}. The hands keep their design ({manos}) and the card backs stay as they are: white with an ornate brick-red frame and an empty red band across the middle, with no letters on the band
"""

[[cuadros.retirarse]]
zona = "brazos"
texto = """
the arms, hands and cards: with both hands at chest height, the character lazily tosses the two \
face-down cards forward with a flick of the fingers, hands open. The hands keep their design ({manos}) \
and the card backs stay as they are: white with an ornate brick-red frame and an empty red band across the middle, with no letters on the band
"""

# gana son dos cambios, cada uno en su llamada y sobre la base: primero los brazos, luego la cara
[[cuadros.gana]]
zona = "brazos"
texto = """
the arms, hands and cards: the character holds the two cards against the chest with one hand and \
raises a small stack of {fichas} at chest height with the other, as if pulling the pot toward \
themselves. The hands keep their design ({manos}) and the card backs stay as they are: white with an ornate brick-red frame and an empty red band across the middle, with no letters on the band
"""

[[cuadros.gana]]
zona = "cara"
texto = "{sonrisa}"

# ---------- cartas: el reverso de la baraja en las cartas de la mano (comando cartas) ----------
# La entrada es un dibujo: la espera aprobada con las cartas viejas tapadas y las nuevas dibujadas por código (el reverso
# aprobado, arte/baraja/reverso-carta.png, y la franja de la etiqueta vacía) al ancho de la mesa (CARTA_MESA en
# generar-personaje.py), con los dedos que estaban sobre las viejas encima. Gemini respeta la forma de lo que recibe, así
# que solo redibuja las manos y los antebrazos alrededor de esas cartas; de su respuesta solo se toma la zona, y de las
# cartas, lo que no cambió sigue siendo el dibujo. Las letras de la franja las pone el juego.
[cartas]
texto = """
Edit the attached image. It is a draft: the two face-down playing cards held in the hands are already drawn with \
their final size, position, angle and design (white backs with an ornate brick-red frame and an empty red band \
across the middle). Redraw only the hands and the forearms so they hold these two cards naturally: {agarre} The \
hands keep their design ({manos}) and their size. Clean up any smudged area around the cards so the body behind them \
looks naturally drawn, in the same style as the rest of the image. Keep the two cards exactly as they are in the \
draft: the same size, position, angle, frame and empty red band, with no letters on the band. Everything else stays \
exactly identical, pixel for pixel: {se_queda}, the line work, the colors, the framing, the size, the position and \
the flat {fondo} background.{opacas} Do not add text, letters, numbers or logos anywhere.
"""
# cómo sostienen las cartas, para los seis: los dedos van encima, por la orilla de abajo y los lados
agarre = "the fingers are in front of the cards, gripping them by the bottom edge and the sides, covering as little of the card backs as possible and never covering the red bands."
se_queda = "the face and the expression, the head{rasgos}, the body, the upper arms, the legs, the chair"

# las frases de las revisiones propias de este comando, para el reintento
[cartas.correcciones]
tamano = "Keep the two cards exactly the size they have in the draft."
sin_cartas = "Keep the two cards exactly as they are drawn in the draft."
franja = "Keep the empty red band across the middle of each card fully visible and unchanged: no fingers over it and no letters on it."
dedos = "The fingers must be in front of the cards, visibly gripping their bottom edge and sides."
azul = "No part of the old navy blue card backs remains."
rojo = "Keep the red of the cards a pure brick red, never pink or purple."

# ---------- mis brazos en primera persona (comando brazos) ----------
# No hay base aprobada que editar: la primera imagen es un boceto, la silueta de relleno del juego (RELLENO y FIGURAS
# de client/stage/arms.js) del color de las manos del personaje y sobre su fondo; en izq-ver lleva encima las dos
# cartas en blanco donde el juego pone las de verdad, y encima de ellas el pulgar. La segunda es su espera aprobada, de
# referencia; en der-jugar lleva detrás de los dedos dos columnitas de fichas de prueba, y en izq-mesa debajo de la mano
# mis dos cartas boca abajo de prueba, donde el juego pone las de verdad.
# Así el arte cae en las mismas anclas que el relleno. Lo que va entre llaves sale de la ficha ({manos}, {antebrazos},
# {fondo}) o de la toma ({toma}, {detalle}, {sin}: lo demás que no se dibuja; {lado}).
[brazos]
tamano = "2K"   # en una pantalla 5K el brazo se ve de unos 1550 px de alto; a 1K mediría 1024
texto = """
The first attached image is a rough placeholder for a first-person view in a cartoon poker game: {toma} \
Redraw the placeholder arm and hand as the player's own {lado} forearm and hand, drawn as the character in the \
second attached image ({manos}; {antebrazos}). The second image is only a reference for the design, the colors, the \
line work and the art style: do not copy its pose, its chair or its cards. Use the same style as that character: flat \
colors with a single flat shadow, a thin uniform dark brown ink outline, no gradients and no shine. Keep the \
position, size and angle of the placeholder: the forearm comes in from the bottom edge of the image and is cut \
straight by it, and the hand stays where the placeholder hand is. The placeholder is only a rough mitten-like shape: \
draw a real hand with the character's own fingers in that same space. {detalle} Draw nothing else: no \
table, {sin}no other hand, no cast shadow, and no text, letters, numbers or logos. The flat {fondo} \
background stays flat and unchanged everywhere else.
"""

[brazos.tomas.izq-ver]
toma = "the player raises the left hand in front of the face and holds two playing cards fanned out, facing the player."
detalle = """
The two blank cards stay exactly as they are in the placeholder: the same place, size and angle, plain cream white \
with a dark outline and nothing on them (no letters, pips or symbols). The fingers are behind the cards and only the \
thumb is in front of them, pressing their lower left corners, as in the placeholder.
"""
sin = "no chips, no other cards, "

[brazos.tomas.izq-mesa]
toma = """
the player's left hand lies flat on the poker table, palm down, resting on the far half of two face-down cards that \
lie on the table, seen from the player's own eyes looking down at the table at a low angle, so the hand looks short \
and wide.
"""
detalle = """
The two plain cards lying on the table stay exactly as they are in the placeholder: the same place, size and shape, \
plain cream with a dark outline and nothing on them. The hand rests only on their far half (the upper half in the \
image), like the placeholder hand: the half of each card closest to the bottom of the image, with its two corners, \
stays completely visible, with no fingers, thumb or palm over it. The thumb is tucked against the side of the index \
finger, on top of the far half of the left card: it does not hang down toward the player. The forearm comes in from \
the bottom left and passes to the left of the cards without touching them. The fingers point to the right, toward \
the middle of the table. The whole hand, fingertips included, stays inside the \
image and ends where the placeholder hand ends, well before the right edge: the fingers lie together and are no \
longer than the placeholder hand.
"""
sin = "no chips, no other cards, "

[brazos.tomas.der-descansar]
toma = """
the player's right hand rests relaxed on the poker table, a compact, loosely closed hand lying on the felt with the \
fingers curled in, seen from the player's own eyes looking down at the table at a low angle.
"""
detalle = """
The hand is no wider than the placeholder hand: the fingers do not stretch out to the left or to the right. The \
thumb lies on the felt at the bottom, as in the placeholder. The hand holds nothing and is not raised: it is not \
reaching or grabbing.
"""
sin = "no chips, no cards, "

[brazos.tomas.der-jugar]
toma = """
the player's right hand on the poker table, playing with two small stacks of poker chips: the fingertips reach \
forward and touch the bottom of the stacks, as if about to pick up the top chip, seen from the player's own eyes \
looking down at the table at a low angle.
"""
detalle = """
The two small stacks of chips stay exactly as they are in the placeholder: the same place and size, plain cream with \
a dark outline, with no colors, stripes, numbers or symbols. The fingers are in front of the stacks and only their \
tips overlap the bottom of the stacks, leaving most of the stacks visible. The hand is clearly raised and reaching \
up, unlike a hand at rest. Only the index finger and the middle finger reach the stacks (the index the left stack, \
the middle finger the right one); the ring and little fingers stay curled toward the palm, so the hand is no wider \
than the placeholder hand and nothing sticks out to the right. The thumb is at the bottom left, as in the placeholder.
"""
sin = "no cards, no other chips, "

# las frases de las revisiones propias de este comando, para el reintento (las demás, de [correcciones])
[brazos.correcciones]
alineacion = "Keep the arm and hand exactly where the placeholder is, with the same size, angle and outline."
borde = "The forearm comes in from the bottom edge of the image, and nothing touches the top edge or the sides."
pieza = "Draw a single arm and hand in one piece, with nothing else around it."
cartas = "Keep the two blank cards exactly as they are in the placeholder: the same place, size and angle, plain and blank."
pulgar = "The thumb must be in front of the cards, pressing their lower left corners."
fichas = "Keep the two small stacks of plain cream chips exactly as they are in the placeholder, mostly visible, with only the fingertips over their bottom."
dedos = "The fingertips must touch the bottom of the two small stacks of chips."
lugar = "Keep the hand no wider than the placeholder hand: the fingers do not reach further left or right than it."
mesa = "Keep the two plain cards on the table exactly as they are in the placeholder."
cerca = "Leave the near half of both cards (the half closest to the bottom of the image) completely visible: the hand rests only on their far half, like the placeholder hand."
tapa = "The hand rests on the far half of the two cards, covering it, like the placeholder hand."
