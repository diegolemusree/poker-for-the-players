<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la app: el ojo de párpado caído del logo sobre el tapiz del garaje, con la luz de la lámpara.
       El ojo cabe en el círculo central (80 %) para que sirva también como ícono "maskable". -->
  <defs>
    <pattern id="tapiz" width="92" height="512" patternUnits="userSpaceOnUse">
      <rect width="46" height="512" fill="#5e3324"/><rect x="46" width="46" height="512" fill="#55301f"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#tapiz)"/>
  <ellipse cx="256" cy="0" rx="330" ry="300" fill="#b0603e" opacity=".22"/>
  <ellipse cx="256" cy="0" rx="250" ry="230" fill="#e0b552" opacity=".24"/>
  <g transform="translate(256 262) rotate(-6) scale(9.3) translate(-20 -21)" stroke="#1d1611" stroke-width="2.2" stroke-linejoin="round">
    <circle cx="23.2" cy="24.6" r="16" fill="#a4452f"/>
    <circle cx="20" cy="21" r="16" fill="#fbf6e6"/>
    <circle cx="23" cy="25.5" r="4.6" fill="#1d1611" stroke="none"/>
    <path d="M4 21.5 A16 16 0 0 1 36 21.5 Z" fill="#e0b552"/>
  </g>
</svg>
