<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Hold'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dce6e0; --text:#13201b; --muted:#4b5e55; --panel:#f5f8f6; --line:#c2cfc8;
  --felt:#0f5b4b; --felt-hi:#16745f; --felt-lo:#093d32; --rail:#2a1913; --rail-hi:#55331f;
  --ivory:#fbf8ef; --red:#c4302b; --black:#17181a; --gold:#e6b54c; --coral:#ef6a4f;
  --ui:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0b1512; --text:#e3ece7; --muted:#93a69d; --panel:#13221d; --line:#26392f; }
}
:root[data-theme="dark"]{ --bg:#0b1512; --text:#e3ece7; --muted:#93a69d; --panel:#13221d; --line:#26392f; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.45;min-height:100%}
button,input{font:inherit;color:inherit}
.top{max-width:1100px;margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.top .meta{color:var(--muted);font-size:15px}
.top .spacer{flex:1}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:14px}
.notice{max-width:1100px;margin:10px auto 0;padding:0 16px}
.notice p{margin:0;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:15px}
.notice p.err{border-color:var(--coral)}

.stage{max-width:1100px;margin:0 auto;padding:8px 16px 0}
.table{position:relative;margin:20px auto 34px;width:min(100%, calc(66vh * 1.6));aspect-ratio:16/10}
.felt{position:absolute;inset:10% 8%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 38%, var(--felt-hi), var(--felt) 52%, var(--felt-lo));
  box-shadow:0 0 0 14px var(--rail), 0 0 0 17px var(--rail-hi), 0 18px 40px rgba(0,0,0,.35), inset 0 0 50px rgba(0,0,0,.35)}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:1;pointer-events:none}
.board{display:flex;gap:6px;--cw:clamp(36px,6.2vw,62px)}
.pot{background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:3px 12px 3px 6px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.chip{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px dashed #fff3cf;flex:none}
.msg{color:#eaf6f1;font-size:14px;text-align:center;max-width:60%;min-height:1.4em}
.msg strong{color:#fff}

.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(88px,13vw,128px);z-index:2;text-align:center}
.seat .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 6px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.seat .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stack{font-size:13px;color:var(--muted)}
.seat .tag{font-size:12px;color:var(--muted)}
.seat.turn .box{outline:3px solid var(--coral);outline-offset:1px}
.seat.folded .box{opacity:.55}
.seat.win .box{outline:3px solid var(--gold);outline-offset:1px}
.seat .hand{display:flex;justify-content:center;gap:3px;margin-bottom:-14px;position:relative;z-index:1;--cw:30px;min-height:0}
.seat.me .hand{--cw:46px;margin-bottom:-10px}
.seat .dealer{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat .handname{font-size:12px;font-weight:600;color:var(--text)}
.sit{width:100%;padding:10px 6px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.55);background:rgba(0,0,0,.18);color:#fff;cursor:pointer;font-weight:600;font-size:14px}
.sit:hover{background:rgba(0,0,0,.3)}
.sit[disabled]{cursor:default;opacity:.5}
.emptyseat{width:100%;padding:10px 6px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.3);color:rgba(255,255,255,.55);font-size:13px}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:1;background:rgba(0,0,0,.35);color:#fff;border-radius:999px;padding:2px 9px 2px 4px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.bet .chip{width:14px;height:14px;border-width:2px}

.card{width:var(--cw,34px);aspect-ratio:5/7;border-radius:calc(var(--cw,34px)*.13);background:var(--ivory);color:var(--black);
  box-shadow:0 1px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25);position:relative;font-family:var(--serif);flex:none}
.card .r{position:absolute;top:5%;left:9%;font-weight:900;font-size:calc(var(--cw,34px)*.4);line-height:1;letter-spacing:-.04em}
.card .s{position:absolute;bottom:4%;right:9%;font-size:calc(var(--cw,34px)*.48);line-height:1}
.card.red{color:var(--red)}
.card.back{background:repeating-linear-gradient(45deg,#b4402d 0 4px,#cd5a42 4px 8px);border:2px solid var(--ivory)}
.card.slot{background:rgba(255,255,255,.05);box-shadow:none;border:1.5px dashed rgba(255,255,255,.22)}
.card.deal{animation:deal .28s ease-out}
@keyframes deal{from{transform:translateY(-10px) scale(.92);opacity:0}to{transform:none;opacity:1}}

.bar{position:sticky;bottom:0;bottom:env(safe-area-inset-bottom,0px);z-index:5;background:var(--panel);border-top:1px solid var(--line);margin-top:8px}
.bar .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:15px;margin:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.go{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.hot{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.raise{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.raise input[type=range]{flex:1;min-width:140px;accent-color:var(--coral)}
.raise input[type=number]{width:96px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.nick{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:180px}

.log{max-width:1100px;margin:0 auto;padding:14px 16px 28px}
.log h2{font-size:16px;margin:0 0 6px}
.log ol{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted)}
.log li{padding:3px 0;border-bottom:1px solid var(--line)}

@media (max-width:640px){
  .table{aspect-ratio:3/4.3;width:min(100%, calc(64vh * .7));margin-top:28px}
  .felt{inset:9% 12%}
  .seat{width:84px}
  .seat .name{font-size:13px}
  .seat .hand{--cw:24px}
  .seat.me .hand{--cw:42px}
  .msg{max-width:70%}
}
@media (prefers-reduced-motion:reduce){ .card.deal{animation:none} }
</style>
</head>
<body>
<header class="top">
  <h1>Mesa de Hold'em</h1>
  <span class="meta" id="meta">Ciegas 10/20, fichas iniciales 1,000</span>
  <span class="spacer"></span>
  <button class="linkbtn" id="resetBtn" hidden>Reiniciar mesa</button>
</header>
<div class="notice" id="notice"></div>
<main class="stage">
  <div class="table" id="table">
    <div class="felt"></div>
    <div class="center">
      <div class="board" id="board"></div>
      <div class="pot" id="pot" hidden><span class="chip"></span><span id="potAmt">0</span></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</main>
<div class="bar"><div class="in" id="bar"></div></div>
<section class="log"><h2>Últimas jugadas</h2><ol id="log"></ol></section>

<script>
(() => {
'use strict';
const SB = 10, BB = 20, START = 1000, MAXP = 8, TURN_LIMIT = 45000;
const TABLE = 'tables/main', LOCK = 'locks/main';
const RANKS = '23456789TJQKA', SUITS = 'shdc';
const GLYPH = { s:'♠', h:'♥', d:'♦', c:'♣' };
const HAND_NAMES = ['Carta alta','Par','Doble par','Trío','Escalera','Color','Full','Póker','Escalera de color'];
const BETTING = ['preflop','flop','turn','river'];

let db = null, user = null, myId = null, readOnly = false, isOwner = false;
let state = null, busy = false, errorText = '', ready = false;
let profileNames = {};
let lastBoardLen = 0, lastHand = 0;
const tabId = Math.random().toString(36).slice(2);
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- cards & hand evaluation ---------- */
const RV = r => RANKS.indexOf(r) + 2;
function newDeck(){
  const d = []; for (const r of RANKS) for (const s of SUITS) d.push(r + s);
  const a = new Uint32Array(52); crypto.getRandomValues(a);
  for (let i = 51; i > 0; i--){ const j = a[i] % (i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function score5(cs){
  const v = cs.map(c => RV(c[0])).sort((a,b) => b - a);
  const flush = cs.every(c => c[1] === cs[0][1]);
  let sh = 0;
  if (new Set(v).size === 5){ if (v[0] - v[4] === 4) sh = v[0]; else if (v[0] === 14 && v[1] === 5) sh = 5; }
  const cnt = {}; v.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  const g = Object.entries(cnt).map(([r,c]) => [+r, c]).sort((a,b) => b[1] - a[1] || b[0] - a[0]);
  const ord = g.map(x => x[0]);
  if (sh && flush) return [8, sh];
  if (g[0][1] === 4) return [7, ...ord];
  if (g[0][1] === 3 && g[1][1] === 2) return [6, ...ord];
  if (flush) return [5, ...v];
  if (sh) return [4, sh];
  if (g[0][1] === 3) return [3, ...ord];
  if (g[0][1] === 2 && g[1][1] === 2) return [2, ...ord];
  if (g[0][1] === 2) return [1, ...ord];
  return [0, ...v];
}
function cmp(a, b){ for (let i = 0; i < Math.max(a.length, b.length); i++){ const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; }
function bestHand(cs){
  if (cs.length <= 5) return score5(cs);
  let best = null;
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++){
    const s = score5(cs.filter((_, k) => k !== i && k !== j));
    if (!best || cmp(s, best) > 0) best = s;
  }
  return best;
}
const handName = s => (s[0] === 8 && s[1] === 14) ? 'Escalera real' : HAND_NAMES[s[0]];

/* ---------- game rules ---------- */
function blankState(){
  return { players:[], phase:'lobby', deck:[], board:[], dealerSeat:-1, toAct:null,
           currentBet:0, minRaise:BB, handNo:0, log:[], results:null, turnAt:0 };
}
const label = p => p.nick || ('Asiento ' + (p.seat + 1));
const sorted = s => s.players.slice().sort((a,b) => a.seat - b.seat);
const live = s => s.players.filter(p => p.inHand && !p.folded);
const canAct = p => p.inHand && !p.folded && !p.allIn;
function nextFrom(s, seat, pred){
  const ps = sorted(s);
  for (let k = 1; k <= MAXP; k++){
    const t = (seat + k + MAXP) % MAXP;
    const p = ps.find(x => x.seat === t);
    if (p && pred(p)) return p;
  }
  return null;
}
function addLog(s, text){ s.log.push(text); if (s.log.length > 40) s.log = s.log.slice(-40); }
function post(p, amt){
  const a = Math.max(0, Math.min(amt, p.stack));
  p.stack -= a; p.bet += a; p.total += a;
  if (p.stack === 0) p.allIn = true;
  return a;
}
function startHand(s){
  if (!['lobby','showdown'].includes(s.phase)) throw new Error('Ya hay una mano en juego.');
  s.players = s.players.filter(p => !p.leaving);
  s.players.forEach(p => Object.assign(p, { bet:0, total:0, cards:[], folded:false, allIn:false, acted:false, inHand:p.stack > 0 }));
  const ins = s.players.filter(p => p.inHand);
  if (ins.length < 2) throw new Error('Se necesitan al menos 2 jugadores con fichas.');
  const dealer = nextFrom(s, s.dealerSeat, p => p.inHand);
  s.dealerSeat = dealer.seat;
  const sb = ins.length === 2 ? dealer : nextFrom(s, dealer.seat, p => p.inHand);
  const bb = nextFrom(s, sb.seat, p => p.inHand);
  post(sb, SB); post(bb, BB);
  s.deck = newDeck(); s.board = []; s.results = null;
  for (let r = 0; r < 2; r++){
    let p = dealer;
    for (let i = 0; i < ins.length; i++){ p = nextFrom(s, p.seat, x => x.inHand); p.cards.push(s.deck.pop()); }
  }
  s.currentBet = BB; s.minRaise = BB; s.phase = 'preflop'; s.handNo = (s.handNo || 0) + 1;
  addLog(s, `Mano ${s.handNo}: reparte ${label(dealer)}. Ciegas de ${label(sb)} y ${label(bb)}.`);
  progress(s, bb.seat);
}
function roundDone(s){
  const actors = s.players.filter(canAct);
  if (actors.length <= 1){
    const maxBet = Math.max(0, ...live(s).map(p => p.bet));
    return actors.length === 0 || actors[0].bet >= maxBet;
  }
  return actors.every(p => p.acted && p.bet === s.currentBet);
}
function nextStreet(s){
  s.players.forEach(p => { p.bet = 0; p.acted = false; });
  s.currentBet = 0; s.minRaise = BB;
  if (s.phase === 'preflop'){ s.board.push(s.deck.pop(), s.deck.pop(), s.deck.pop()); s.phase = 'flop'; }
  else if (s.phase === 'flop'){ s.board.push(s.deck.pop()); s.phase = 'turn'; }
  else if (s.phase === 'turn'){ s.board.push(s.deck.pop()); s.phase = 'river'; }
}
function progress(s, lastSeat){
  if (live(s).length === 1) return winByFold(s);
  if (roundDone(s)){
    if (s.phase === 'river') return showdown(s);
    nextStreet(s);
    if (s.players.filter(canAct).length <= 1){
      while (s.phase !== 'river') nextStreet(s);
      return showdown(s);
    }
    const first = nextFrom(s, s.dealerSeat, canAct);
    s.toAct = first.id; s.turnAt = Date.now();
    return;
  }
  const nxt = nextFrom(s, lastSeat, p => canAct(p) && (!p.acted || p.bet < s.currentBet));
  if (!nxt){ // safety net
    s.players.forEach(p => { if (canAct(p)) p.acted = true; });
    return progress(s, lastSeat);
  }
  s.toAct = nxt.id; s.turnAt = Date.now();
}
function winByFold(s){
  const w = live(s)[0];
  const pot = s.players.reduce((a, p) => a + p.total, 0);
  w.stack += pot;
  s.results = { fold:true, shown:[], winners:[{ id:w.id, name:label(w), amount:pot, hand:'' }] };
  s.phase = 'showdown'; s.toAct = null;
  addLog(s, `${label(w)} gana ${pot} (los demás se retiraron).`);
}
function showdown(s){
  const L = live(s), sc = {};
  L.forEach(p => sc[p.id] = bestHand([...p.cards, ...s.board]));
  const contrib = s.players.filter(p => p.total > 0);
  const levels = [...new Set(contrib.map(p => p.total))].sort((a,b) => a - b);
  const won = {}; let prev = 0, carry = 0;
  const seatOrder = p => (p.seat - s.dealerSeat - 1 + MAXP) % MAXP;
  for (const lv of levels){
    let amt = carry; carry = 0;
    contrib.forEach(p => amt += Math.max(0, Math.min(p.total, lv) - prev));
    prev = lv;
    const elig = L.filter(p => p.total >= lv);
    if (!elig.length){ carry = amt; continue; }
    let top = null, ws = [];
    elig.forEach(p => { const c = top ? cmp(sc[p.id], top) : 1; if (c > 0){ top = sc[p.id]; ws = [p]; } else if (c === 0) ws.push(p); });
    ws.sort((a,b) => seatOrder(a) - seatOrder(b));
    const share = Math.floor(amt / ws.length); let rem = amt - share * ws.length;
    ws.forEach(p => { const a = share + (rem > 0 ? 1 : 0); if (rem > 0) rem--; won[p.id] = (won[p.id] || 0) + a; });
  }
  if (carry){
    const top = L.slice().sort((a,b) => cmp(sc[b.id], sc[a.id]))[0];
    won[top.id] = (won[top.id] || 0) + carry;
  }
  const winners = [];
  Object.entries(won).forEach(([id, amt]) => {
    const p = s.players.find(x => x.id === id); p.stack += amt;
    winners.push({ id, name:label(p), amount:amt, hand:handName(sc[id]) });
    addLog(s, `${label(p)} gana ${amt} con ${handName(sc[id]).toLowerCase()}.`);
  });
  s.results = { fold:false, shown:L.map(p => p.id), hands:Object.fromEntries(L.map(p => [p.id, handName(sc[p.id])])), winners };
  s.phase = 'showdown'; s.toAct = null;
}
function act(s, id, type, amount){
  if (!BETTING.includes(s.phase) || s.toAct !== id) throw new Error('No es tu turno.');
  const p = s.players.find(x => x.id === id);
  const toCall = s.currentBet - p.bet;
  if (type === 'fold'){ p.folded = true; addLog(s, `${label(p)} se retira.`); }
  else if (type === 'check'){
    if (toCall > 0) throw new Error('No puedes pasar, hay una apuesta.');
    addLog(s, `${label(p)} pasa.`);
  }
  else if (type === 'call'){
    if (toCall <= 0){ addLog(s, `${label(p)} pasa.`); }
    else { const a = post(p, toCall); addLog(s, `${label(p)} iguala ${a}${p.allIn ? ' (all-in)' : ''}.`); }
  }
  else if (type === 'raise'){
    const maxT = p.bet + p.stack;
    let target = Math.min(Math.floor(amount), maxT);
    const minT = s.currentBet === 0 ? BB : s.currentBet + s.minRaise;
    if (target <= s.currentBet) return act(s, id, 'call');
    if (target < minT && target < maxT) throw new Error(`La apuesta mínima es ${minT}.`);
    const raiseBy = target - s.currentBet;
    const was = s.currentBet;
    post(p, target - p.bet);
    if (raiseBy >= s.minRaise){ s.minRaise = raiseBy; s.players.forEach(x => { if (x !== p) x.acted = false; }); }
    s.currentBet = target;
    addLog(s, `${label(p)} ${was === 0 ? 'apuesta' : 'sube a'} ${target}${p.allIn ? ' (all-in)' : ''}.`);
  }
  p.acted = true;
  progress(s, p.seat);
}
function foldOut(s, p){
  if (!BETTING.includes(s.phase) || !p.inHand || p.folded) return;
  p.folded = true; p.acted = true;
  if (s.toAct === p.id) progress(s, p.seat);
  else if (live(s).length === 1) winByFold(s);
}

/* ---------- writes ---------- */
async function mutate(fn){
  if (busy || !db || readOnly) return;
  busy = true; errorText = ''; render();
  try {
    let got = false;
    for (let i = 0; i < 24; i++){
      const r = await db.doc(LOCK).acquire({ holder: myId + ':' + tabId, ttlMs: 1500 });
      if (r.acquired){ got = true; break; }
      await sleep(200 + Math.random() * 300);
    }
    if (!got) throw new Error('La mesa está ocupada. Intenta de nuevo.');
    const snap = await db.doc(TABLE).get();
    const s = snap.exists ? structuredClone(snap.data()) : blankState();
    fn(s);
    await db.doc(TABLE).set(s);
  } catch (e) {
    if (e && e.code){
      if (e.code === 'invalid_argument'){ readOnly = true; errorText = 'No tienes permiso para jugar en esta mesa, solo para mirar.'; }
      else errorText = 'No se pudo guardar la jugada. Revisa tu conexión e intenta de nuevo.';
    } else errorText = (e && e.message) || 'Algo salió mal.';
  } finally { busy = false; render(); }
}

/* ---------- rendering ---------- */
function cardEl(c, opts = {}){
  const d = document.createElement('div');
  if (!c){ d.className = 'card ' + (opts.back ? 'back' : 'slot'); return d; }
  d.className = 'card' + ('hd'.includes(c[1]) ? ' red' : '') + (opts.fresh ? ' deal' : '');
  const r = document.createElement('span'); r.className = 'r'; r.textContent = c[0] === 'T' ? '10' : c[0];
  const s = document.createElement('span'); s.className = 's'; s.textContent = GLYPH[c[1]];
  d.append(r, s);
  d.setAttribute('aria-label', (c[0] === 'T' ? '10' : c[0]) + ' de ' + ({s:'picas',h:'corazones',d:'diamantes',c:'tréboles'})[c[1]]);
  return d;
}
function displayName(p){ return p.nick || profileNames[p.id] || ('Asiento ' + (p.seat + 1)); }
async function refreshProfiles(){
  if (!user || !state) return;
  const ids = state.players.map(p => p.id);
  if (!ids.length) return;
  try {
    const ps = await user.profiles(ids);
    let changed = false;
    ids.forEach(id => { const n = (ps[id] && ps[id].name) || ''; if (profileNames[id] !== n){ profileNames[id] = n; changed = true; } });
    if (changed) render(true);
  } catch {}
}
function btn(text, cls, onClick, disabled){
  const b = document.createElement('button');
  b.className = 'btn ' + (cls || ''); b.textContent = text; b.disabled = !!disabled || busy;
  b.addEventListener('click', onClick);
  return b;
}

function render(skipProfiles){
  const s = state || blankState();
  const me = s.players.find(p => p.id === myId);
  const pot = s.players.reduce((a, p) => a + (p.total || 0), 0);

  $('meta').textContent = s.handNo ? `Mano ${s.handNo}, ciegas ${SB}/${BB}` : `Ciegas ${SB}/${BB}, fichas iniciales 1,000`;
  $('resetBtn').hidden = !isOwner;

  // notice
  const n = $('notice'); n.replaceChildren();
  const note = (t, err) => { const p = document.createElement('p'); p.textContent = t; if (err) p.className = 'err'; n.append(p); };
  if (!ready) note('Conectando con la mesa…');
  else if (!db) note('Para jugar, abre esta mesa desde su link publicado en Claude con tu sesión iniciada.');
  else if (readOnly && !errorText) note('Estás mirando la mesa. Para jugar, pídele al dueño que te invite con permiso de edición.');
  if (errorText) note(errorText, true);

  // board
  const board = $('board'); board.replaceChildren();
  const fresh = s.handNo !== lastHand ? 0 : lastBoardLen;
  for (let i = 0; i < 5; i++) board.append(cardEl(s.board[i], { fresh: i >= fresh && s.board[i] }));
  lastBoardLen = s.board.length; lastHand = s.handNo;
  $('pot').hidden = pot === 0;
  $('potAmt').textContent = pot.toLocaleString('es-MX');

  // center message
  const msg = $('msg'); msg.replaceChildren();
  if (s.phase === 'showdown' && s.results){
    s.results.winners.forEach((w, i) => {
      if (i) msg.append(document.createElement('br'));
      const st = document.createElement('strong'); st.textContent = w.name;
      msg.append(st, ` gana ${w.amount.toLocaleString('es-MX')}${w.hand ? ' con ' + w.hand.toLowerCase() : ''}`);
    });
  } else if (s.phase === 'lobby'){
    msg.textContent = s.players.length < 2 ? 'Esperando jugadores' : 'Listos para repartir';
  } else if (s.toAct){
    const p = s.players.find(x => x.id === s.toAct);
    msg.textContent = p ? (p.id === myId ? 'Te toca' : `Turno de ${displayName(p)}`) : '';
  }

  // seats
  const table = $('table');
  table.querySelectorAll('.seat,.bet').forEach(e => e.remove());
  const base = me ? me.seat : 0;
  const portrait = matchMedia('(max-width:640px)').matches;
  for (let seat = 0; seat < MAXP; seat++){
    const pos = (seat - base + MAXP) % MAXP;
    const ang = Math.PI / 2 + pos * (2 * Math.PI / MAXP);
    const rx = portrait ? 44 : 46, ry = portrait ? 45 : 44;
    const x = 50 + rx * Math.cos(ang), y = 50 + ry * Math.sin(ang);
    const p = s.players.find(q => q.seat === seat);
    const el = document.createElement('div');
    el.className = 'seat'; el.style.left = x + '%'; el.style.top = y + '%';
    if (!p){
      if (!me && db && !readOnly){
        const b = document.createElement('button'); b.className = 'sit'; b.textContent = 'Sentarse aquí'; b.disabled = busy;
        b.addEventListener('click', () => joinSeat(seat)); el.append(b);
      } else { const d = document.createElement('div'); d.className = 'emptyseat'; d.textContent = 'Libre'; el.append(d); }
      table.append(el); continue;
    }
    const isMe = p.id === myId;
    const shown = s.phase === 'showdown' && s.results && s.results.shown.includes(p.id);
    const winner = s.phase === 'showdown' && s.results && s.results.winners.some(w => w.id === p.id);
    if (isMe) el.classList.add('me');
    if (s.toAct === p.id) el.classList.add('turn');
    if (p.inHand && p.folded) el.classList.add('folded');
    if (winner) el.classList.add('win');
    const hand = document.createElement('div'); hand.className = 'hand';
    if (p.inHand && p.cards && p.cards.length && !(p.folded && !isMe)){
      p.cards.forEach(c => hand.append((isMe || shown) ? cardEl(c) : cardEl(null, { back:true })));
    }
    const box = document.createElement('div'); box.className = 'box';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = displayName(p) + (isMe ? ' (tú)' : '');
    const st = document.createElement('div'); st.className = 'stack'; st.textContent = p.stack.toLocaleString('es-MX') + ' fichas';
    box.append(nm, st);
    let tag = '';
    if (p.leaving) tag = 'Se levantó';
    else if (!p.inHand && s.phase !== 'lobby') tag = p.stack === 0 ? 'Sin fichas' : 'Espera la próxima';
    else if (p.inHand && p.folded) tag = 'Retirado';
    else if (p.allIn) tag = 'All-in';
    if (shown && s.results.hands && s.results.hands[p.id]){ const h = document.createElement('div'); h.className = 'handname'; h.textContent = s.results.hands[p.id]; box.append(h); }
    else if (tag){ const t = document.createElement('div'); t.className = 'tag'; t.textContent = tag; box.append(t); }
    if (s.dealerSeat === seat && s.handNo){ const d = document.createElement('div'); d.className = 'dealer'; d.textContent = 'D'; d.title = 'Reparte'; box.append(d); }
    el.append(hand, box);
    table.append(el);
    if (p.bet > 0 && BETTING.includes(s.phase)){
      const b = document.createElement('div'); b.className = 'bet';
      b.style.left = (50 + rx * 0.62 * Math.cos(ang)) + '%'; b.style.top = (50 + ry * 0.58 * Math.sin(ang)) + '%';
      const c = document.createElement('span'); c.className = 'chip';
      b.append(c, p.bet.toLocaleString('es-MX')); table.append(b);
    }
  }

  renderBar(s, me, pot);

  // log
  const log = $('log'); log.replaceChildren();
  s.log.slice(-10).reverse().forEach(t => { const li = document.createElement('li'); li.textContent = t; log.append(li); });

  document.title = (me && s.toAct === myId) ? '¡Te toca! Mesa de Hold\'em' : 'Mesa de Hold\'em';
  if (!skipProfiles) refreshProfiles();
}

function renderBar(s, me, pot){
  const bar = $('bar'); bar.replaceChildren();
  const hint = t => { const p = document.createElement('p'); p.className = 'hint'; p.textContent = t; bar.append(p); };
  if (!db || readOnly){ hint(db ? 'Modo espectador.' : 'La mesa no está conectada.'); return; }
  if (!me){
    hint('Escribe tu apodo y elige un asiento libre en la mesa.');
    const row = document.createElement('div'); row.className = 'row';
    const inp = document.createElement('input'); inp.className = 'nick'; inp.id = 'nickInput'; inp.maxLength = 16;
    inp.placeholder = 'Tu apodo'; inp.setAttribute('aria-label', 'Tu apodo'); inp.value = sessionNick;
    inp.addEventListener('input', () => sessionNick = inp.value);
    row.append(inp); bar.append(row); return;
  }
  const row = document.createElement('div'); row.className = 'row';
  const betting = BETTING.includes(s.phase);
  if (betting && s.toAct === myId){
    const toCall = s.currentBet - me.bet;
    row.append(btn('Retirarse', '', () => mutate(st => act(st, myId, 'fold'))));
    if (toCall <= 0) row.append(btn('Pasar', 'go', () => mutate(st => act(st, myId, 'check'))));
    else row.append(btn(toCall >= me.stack ? `All-in ${me.stack}` : `Igualar ${toCall}`, 'go', () => mutate(st => act(st, myId, 'call'))));
    bar.append(row);
    const maxT = me.bet + me.stack;
    const minT = Math.min(maxT, s.currentBet === 0 ? BB : s.currentBet + s.minRaise);
    if (maxT > s.currentBet && me.stack > toCall){
      const wrap = document.createElement('div'); wrap.className = 'raise';
      const rng = document.createElement('input'); rng.type = 'range'; rng.min = minT; rng.max = maxT; rng.step = 10; rng.value = minT;
      rng.setAttribute('aria-label', 'Cantidad');
      const num = document.createElement('input'); num.type = 'number'; num.min = minT; num.max = maxT; num.step = 10; num.value = minT;
      num.setAttribute('aria-label', 'Cantidad');
      const verb = s.currentBet === 0 ? 'Apostar' : 'Subir a';
      const go = btn('', 'hot', () => mutate(st => act(st, myId, 'raise', clamp(+num.value))));
      const clamp = v => Math.max(minT, Math.min(maxT, Math.round(v || minT)));
      const setV = v => { v = clamp(v); rng.value = v; num.value = v; go.textContent = v >= maxT ? `All-in ${v}` : `${verb} ${v}`; };
      rng.addEventListener('input', () => setV(+rng.value));
      num.addEventListener('change', () => setV(+num.value));
      const potBet = f => s.currentBet + Math.round((pot + toCall) * f / 10) * 10;
      wrap.append(
        btn('½ bote', 'small', () => setV(potBet(.5))),
        btn('Bote', 'small', () => setV(potBet(1))),
        btn('Todo', 'small', () => setV(maxT)),
        rng, num, go);
      setV(minT);
      bar.append(wrap);
    }
    return;
  }
  if (betting){
    const cur = s.players.find(p => p.id === s.toAct);
    hint(cur ? `Esperando a ${displayName(cur)}…` : 'Esperando…');
    if (cur && Date.now() - (s.turnAt || 0) > TURN_LIMIT){
      row.append(btn(`Saltar turno de ${displayName(cur)}`, 'small', () => mutate(st => {
        if (st.toAct !== cur.id || Date.now() - st.turnAt <= TURN_LIMIT) throw new Error('Ya jugó.');
        const c = st.players.find(x => x.id === cur.id);
        act(st, cur.id, st.currentBet - c.bet > 0 ? 'fold' : 'check');
      })));
    }
  } else {
    const withChips = s.players.filter(p => p.stack > 0 && !p.leaving).length;
    row.append(btn(s.phase === 'lobby' && !s.handNo ? 'Repartir primera mano' : 'Repartir siguiente mano', 'go', () => mutate(startHand), withChips < 2));
    if (withChips < 2) hint('Se necesitan al menos 2 jugadores con fichas para repartir.');
  }
  if (me.stack === 0 && !(betting && me.inHand)){
    row.append(btn('Recargar 1,000', '', () => mutate(st => { const p = st.players.find(x => x.id === myId); if (p && p.stack === 0 && !(BETTING.includes(st.phase) && p.inHand)){ p.stack = START; addLog(st, `${label(p)} recarga ${START}.`); } })));
  }
  row.append(btn('Levantarme', 'small', () => { if (confirm('¿Dejar tu asiento? Perderás tus fichas.')) mutate(leaveSeat); }));
  bar.append(row);
}

let sessionNick = '';
function joinSeat(seat){
  const nick = (sessionNick || '').trim().slice(0, 16);
  mutate(s => {
    if (s.players.some(p => p.id === myId)) throw new Error('Ya estás sentado.');
    if (s.players.some(p => p.seat === seat)) throw new Error('Ese asiento ya está ocupado.');
    const p = { id:myId, nick, seat, stack:START, bet:0, total:0, cards:[], folded:false, allIn:false, acted:false, inHand:false };
    s.players.push(p);
    addLog(s, `${label(p)} se sienta con ${START} fichas.`);
  });
}
function leaveSeat(s){
  const p = s.players.find(x => x.id === myId); if (!p) return;
  addLog(s, `${label(p)} se levanta.`);
  if (BETTING.includes(s.phase) && p.inHand){ foldOut(s, p); if (BETTING.includes(s.phase)){ p.leaving = true; return; } }
  s.players = s.players.filter(x => x.id !== myId);
}

$('resetBtn').addEventListener('click', () => {
  if (confirm('¿Reiniciar la mesa? Se borran todos los jugadores y fichas.')) mutate(s => { Object.assign(s, blankState()); addLog(s, 'La mesa se reinició.'); });
});
addEventListener('resize', () => render(true));
setInterval(() => { if (state && state.toAct && state.toAct !== myId) render(true); }, 5000);

/* ---------- boot ---------- */
render(true);
(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ ready = true; render(true); return; }
  const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
  db = d; user = u;
  if (user){
    myId = await user.id();
    isOwner = await user.isOwner();
    const w = await user.can('data.write');
    if (w === false) readOnly = true;
  }
  if (!myId) db = null;
  ready = true; render(true);
  if (!db) return;
  db.doc(TABLE).onSnapshot(snap => {
    state = snap.exists ? snap.data() : null;
    render();
  }, () => { errorText = 'Se perdió la conexión con la mesa. Recarga la página.'; render(true); });
})();
})();
</script>
</body>
</html>
